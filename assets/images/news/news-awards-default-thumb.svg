<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SOLA news thumbnail placeholder</title>
  <desc id="desc">Abstract geometric background used when no specific photo is available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="240" cy="620" r="220" fill="#dbeafe"/>
  <circle cx="980" cy="220" r="170" fill="#fee2e2"/>
  <rect x="360" y="245" width="480" height="310" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="600" cy="398" r="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="10"/>
  <rect x="426" y="295" width="88" height="42" rx="12" fill="#cbd5e1"/>
  <text x="600" y="648" text-anchor="middle" font-size="42" font-family="Arial, sans-serif" fill="#64748b">SOLA</text>
</svg>
